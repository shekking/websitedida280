<h1 class="Base head_one">The Red Wheel Barrow</h1>
<h1 class="Base head_one Heading_3"><span class="span1">William Carlos Williams</span></h1>
<p class="Base Body p1">so much depends</p>
<stanza class="Base Body stanza">upon </stanza>
<p class="Base Body p2">a red wheel </p>
<stanza class="Base Body stanza">barrow</stanza>
<p class="Base Body p2">glazed with rain</p>
<stanza class="Base Body stanza">water</stanza>
<p class="Base Body p2">beside the white</p>
<stanza class="Base Body stanza">chickens</stanza>
